/* GlassSurface lighting from the React interface, over a live map backdrop. */
.panel,.compass{
  --glass-frost:.29;
  border:1px solid rgba(255,255,255,.25);
  background:
    linear-gradient(135deg,rgba(255,255,255,.42),transparent 42%,transparent 64%,rgba(255,255,255,.18)),
    rgba(255,255,255,var(--glass-frost));
  -webkit-backdrop-filter:blur(12px) saturate(1.4) brightness(1.04);
  backdrop-filter:blur(12px) saturate(1.4) brightness(1.04);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.85),
    inset 0 -1px 0 rgba(255,255,255,.35),
    inset 0 0 2px 1px rgba(0,0,0,.12),
    inset 0 0 12px 3px rgba(255,255,255,.28),
    0 4px 16px rgba(17,17,26,.06),0 8px 24px rgba(17,17,26,.09),0 16px 56px rgba(17,17,26,.08);
}
.panel::after,.compass::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  padding:2px;
  pointer-events:none;
  background:linear-gradient(150deg,rgba(255,255,255,.7),rgba(255,255,255,.1) 45%,rgba(255,255,255,.08) 60%,rgba(255,255,255,.42));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;
}
.controls[open],#info,.legend{--glass-frost:.55}
.dim-map .panel,.dim-map .compass{--glass-frost:.62}
.dim-map .controls[open],.dim-map #info,.dim-map .legend{--glass-frost:.77}
.panel[data-refractive],.compass[data-refractive]{backdrop-filter:var(--glass-refraction) blur(1.5px) saturate(1.15)}
.controls-summary small,.nav-selects label,#nav-result,#nav-result .note,.controls .help{color:#3f4445}

}
#info .building-actions button:hover{background:#fff}
#info .building-actions #nav-here{background:#365e46;color:#fff}
#info .building-actions #nav-here:hover{background:#294b37}
.building-actions svg{width:22px;height:22px}
@media(max-width:720px){
  #info{
    top:max(calc(var(--campus-header-bottom, 98px) + 12px),calc(max(12px,env(safe-area-inset-top)) + 64px));
    left:50%;
    right:auto;
    transform:translateX(-50%);
  }
}
@media(max-height:500px) and (max-width:900px){
  .compass{top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left))}
  #info{top:calc(max(12px,env(safe-area-inset-top)) + 64px);left:max(12px,env(safe-area-inset-left));transform:none}
}

.nav-actions{grid-template-columns:repeat(2,minmax(0,1fr))}
.nav-actions #nav-go{grid-column:1/-1}
.nav-actions #nav-preview{background:#f0f5ef;color:var(--panel-ink)}
.nav-actions #nav-preview:not(:disabled):hover{background:#e4eee4}
.nav-actions #nav-preview:disabled{opacity:.55;cursor:default}

.street-active > :is(header,.controls,.compass,.scale,.label,#info){display:none!important}
#street-hud[hidden],.clean #street-hud{display:none!important}
#street-hud{
  position:fixed;
  z-index:4;
  inset:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right))
        max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  display:grid;
  justify-items:center;
  align-content:space-between;
  gap:12px;
  pointer-events:none;
  color:var(--panel-ink);
}
#street-hud .panel{
  position:relative;
  width:min(100%,440px);
  --glass-frost:.62;
  border-radius:22px;
  pointer-events:auto;
}
.dim-map #street-hud .panel{--glass-frost:.79}
.street-maneuver{
  display:grid;
  grid-template-columns:52px minmax(0,1fr);
  align-items:center;
  gap:14px;
  padding:14px 18px;
}
.street-icon{
  display:grid;
  place-items:center;
  width:52px;
  height:52px;
  border-radius:15px;
  background:rgba(234,251,240,.7);
  color:#21583d;
}
.street-icon svg{width:31px;height:31px}
#street-meters{
  display:block;
  font-size:clamp(24px,5vw,30px);
  line-height:1.12;
  font-weight:720;
  letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
}
#street-instruction{margin:4px 0 0;font-size:15px;font-weight:620;line-height:1.4;overflow-wrap:anywhere}
.street-controls{padding:12px 14px 14px}
.street-trip{
  display:flex;
  flex-wrap:wrap;
  align-items:baseline;
  justify-content:space-between;
  gap:4px 12px;
  margin:0 2px 10px;
  font-size:13px;
  line-height:1.45;
}
.street-trip strong{font-size:14px;font-weight:700;overflow-wrap:anywhere}
#street-remaining{font-variant-numeric:tabular-nums}
.street-location{
  margin:0 0 10px;
  font-size:13px;
  line-height:1.45;
  color:var(--panel-ink);
}
.street-actions [hidden]{display:none!important}
.street-controls[data-location] .street-actions{grid-template-columns:repeat(auto-fit,minmax(100px,1fr))}
.street-actions{display:grid;grid-template-columns:1fr 1.4fr 1.2fr;gap:7px}
.street-actions button{
  min-height:44px;
  padding:4px;
  background:rgba(255,255,255,.7);
  color:var(--panel-ink);
  font-size:13px;
  font-weight:650;
  line-height:1.2;
}
.street-actions button:hover{background:rgba(255,255,255,.92)}
.street-actions button:disabled{opacity:.48;cursor:default}
@media(orientation:landscape) and (max-height:500px){
  #street-hud .panel{width:min(44vw,350px)}
  .street-maneuver{justify-self:start}
  .street-controls{justify-self:end}
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .panel,.compass,header.panel{--glass-frost:.8}
  .controls[open],#info,#street-hud .panel{--glass-frost:.9}
}
</style>
</head><body>
<canvas id="scene" aria-label="可旋转、缩放、选择建筑的三维校园模型" tabindex="0"></canvas>
<div id="loading">正在构建山水校园…</div>
<header class="panel"><div class="eyebrow">NEUSOFT · CAMPUS STUDY / 02</div><h1>广东东软学院 · 山水校园</h1><div class="weather-line" id="weather-status">正在同步校园天气</div><p>照片辅助的建筑与景观初步模型<br>保留地理轮廓，补充立面、屋顶与校园环境</p><div class="stats"><div><strong>85 + 2</strong><span>原始建筑 / 补绘组团</span></div><div><strong id="tree-count">—</strong><span>景观树木</span></div><div><strong>1:1</strong><span>平面米制</span></div></div><span class="tag">概略山体 · 非实测高程</span></header>
<details class="panel controls" id="controls-panel"><summary class="controls-summary"><span class="summary-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18h4a3 3 0 0 0 0-6H8a3 3 0 0 1 0-6h8"/><path d="m13.5 3.5 3 2.5-3 2.5"/><circle cx="5" cy="18" r="1.5"/></svg></span><span class="summary-copy"><strong>校园导航</strong><small id="nav-summary">选择起点与目的地</small></span><span class="summary-action" aria-hidden="true"></span></summary><div class="controls-body"><div class="nav-selects"><label for="nav-from">起点</label><select id="nav-from" aria-label="导航起点"></select><label for="nav-to">目的地</label><select id="nav-to" aria-label="导航终点"></select></div><button type="button" id="nav-swap" class="nav-swap">⇅ 交换起点和目的地</button><div class="nav-actions"><button type="button" id="nav-go">开始导航</button><button type="button" id="nav-preview">路线预览</button><button type="button" id="nav-clear">清除路线</button></div><div id="nav-result" role="status" aria-live="polite"></div><details class="explore"><summary>视角与显示设置</summary><div class="views"><button data-view="overall" class="active">全景 · 山水校园</button><button data-view="teaching">教学区 · 鸟瞰</button><button data-view="clock">D座 · 钟楼</button><button data-view="courts">E / F · 院落</button><button data-view="dorm">东软小镇 · 宿舍</button><button data-view="top">总平面 · 顶视</button></div><div class="toggles"><label><input id="labels" type="checkbox" checked> 建筑名称</label><label><input id="trees" type="checkbox" checked> 景观植被</label><label><input id="clay" type="checkbox"> 建筑白膜</label><label><input id="spin" type="checkbox"> 缓慢环绕</label></div></details><p class="help">拖动旋转 · 点击建筑查看详情</p></div></details>
<button type="button" class="compass" id="compass-reset" aria-label="地图朝北" title="地图朝北">
  <svg viewBox="0 0 44 44" aria-hidden="true">
    <circle cx="22" cy="22" r="20" fill="none" stroke="#314138" stroke-opacity=".28"/>
    <path d="M22 2v2.5M42 22h-2.5M22 42v-2.5M2 22h2.5" stroke="#314138" stroke-opacity=".55" stroke-linecap="round"/>
    <g id="needle">
      <path d="m22 33 5.5-10L22 24l-5.5-1Z" fill="#667a70"/>
      <path d="m22 13-5.5 10 5.5 1 5.5-1Z" fill="#af3f34"/>
      <text id="north" x="22" y="11" text-anchor="middle">N</text>
    </g>
  </svg>
</button><div class="scale"><div id="scale-bar"></div><span id="scale-text">100 m</span></div>
<aside class="panel" id="info" aria-labelledby="info-name">
  <strong id="info-name"></strong>
  <div class="building-actions">
    <button type="button" id="nav-here" title="开始导航" aria-label="开始导航">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 3-6.4 18-3.1-8.5L3 9.4 21 3Z"/></svg>
    </button>
    <button type="button" id="close-info" title="关闭" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
  </div>
</aside>
<div id="street-hud" hidden>
  <section class="panel street-maneuver" aria-label="当前路标">
    <span class="street-icon" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.25" stroke-linecap="round" stroke-linejoin="round">
        <path id="street-arrow" d="M16 26V7m-8 8 8-8 8 8"/>
      </svg>
    </span>
    <div>
      <strong id="street-meters"></strong>
      <p id="street-instruction" role="status" aria-live="polite">沿路线前进</p>
    </div>
  </section>
  <section class="panel street-controls" aria-label="街景导航控制">
    <div class="street-trip">
      <strong id="street-destination"></strong>
      <span id="street-remaining"></span>
    </div>
    <p class="street-location" id="street-location" role="status" hidden></p>
    <div class="street-actions">
      <button type="button" id="street-pause">暂停</button>
      <button type="button" id="street-next">到下一路口</button>
      <button type="button" id="street-replan" hidden>重新规划</button>
      <button type="button" id="street-exit">返回地图</button>
    </div>
  </section>
</div>
<svg width="0" height="0" aria-hidden="true" style="position:absolute;pointer-events:none"><defs id="glass-filters"></defs></svg>
<template id="weather-settings"><div class="weather-setting"><button id="weather-mode" type="button" aria-pressed="false">晴天下午预览</button><a href="https://open-meteo.com/en/licence" target="_blank" rel="noopener">Open-Meteo · CC BY 4.0</a></div></template>
